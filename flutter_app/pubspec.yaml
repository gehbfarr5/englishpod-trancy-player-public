name: englishpod_trancy
description: Trancy-style immersive sentence player for EnglishPod (Android & iOS)
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  shared_preferences: ^2.3.3
  scrollable_positioned_list: ^0.3.8
  path_provider: ^2.1.5
  qr: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/lessons_safe/
    - assets/audio/0001/
    - assets/audio/0002/
    - assets/audio/0003/
