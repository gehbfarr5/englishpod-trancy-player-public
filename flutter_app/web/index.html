<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="EnglishPod listening player">
  <meta name="theme-color" content="#13151c">
  <title>EnglishPod</title>
  <style>
    :root {
      --ep-sat: env(safe-area-inset-top, 0px);
      --ep-sab: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overscroll-behavior: none;
      touch-action: manipulation;
      background: #13151c;
      color: #fff;
      font-family: system-ui;
    }
    #loading { padding: 2rem; }
    #build { position: fixed; right: 6px; bottom: 4px; z-index: 10;
      font: 10px system-ui; color: #888; text-decoration: none; }
  </style>
</head>
<body>
  <div id="loading" role="status">Loading EnglishPod…</div>
  <a id="build" href="build-info.json" target="_blank" rel="noopener">Build details</a>
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        if (window.location.hostname === 'app.englishpod.local' || params.get('epHost') === 'harmonyos') {
          var b = document.getElementById('build');
          if (b) b.style.display = 'none';
        }
      } catch (e) {}
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
