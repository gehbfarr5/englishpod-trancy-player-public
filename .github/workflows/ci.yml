name: Public continuation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client_changes:
    name: Detect affected clients
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.detect.outputs.ios }}
      android: ${{ steps.detect.outputs.android }}
      web: ${{ steps.detect.outputs.web }}
      miniprogram: ${{ steps.detect.outputs.miniprogram }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect client changes
        id: detect
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CLIENT_TEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CLIENT_TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLIENT_TEST_BEFORE_SHA: ${{ github.event.before }}
        run: python3 pipeline/affected_clients.py

  flutter-web:
    name: Flutter tests and Web build
    needs: client_changes
    if: ${{ always() && (needs.client_changes.result != 'success' || needs.client_changes.outputs.web == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Stage synthetic-only test assets
        env:
          EP_NATIVE_TEST_WORKSPACE: "1"
        run: python3 pipeline/prepare_native_test_assets.py
      - name: Test and build Flutter Web
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter test
          flutter build web --release

  mini-program:
    name: Mini Program source checks
    needs: client_changes
    if: ${{ always() && (needs.client_changes.result != 'success' || needs.client_changes.outputs.miniprogram == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate

  g4-offline-tools:
    name: G4 offline benchmark tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=pipeline python -m unittest pipeline/test_g4_benchmark.py pipeline/test_native_test_evidence.py pipeline/test_affected_clients.py

  agent-runner-contract:
    name: Agent runner policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 pipeline/test_agent_run_outcome.py
      - run: python3 .github/scripts/tests/test_opencode.py

  cloud-identity-probes:
    name: Cloud identity probe policy tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=pipeline python -m unittest pipeline/test_tencent_oidc.py pipeline/test_tencent_cos_probe.py pipeline/test_web_delivery.py
