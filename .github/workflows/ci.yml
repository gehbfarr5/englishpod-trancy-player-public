name: Public continuation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-web:
    name: Flutter tests and Web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Stage synthetic-only test assets
        env:
          EP_NATIVE_TEST_WORKSPACE: "1"
        run: python3 pipeline/prepare_native_test_assets.py
      - name: Test and build Flutter Web
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter test
          flutter build web --release

  mini-program:
    name: Mini Program source checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate

  g4-offline-tools:
    name: G4 offline benchmark tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=pipeline python -m unittest pipeline/test_g4_benchmark.py pipeline/test_native_test_evidence.py

  agent-runner-contract:
    name: Agent runner policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 pipeline/test_agent_run_outcome.py
      - run: python3 .github/scripts/tests/test_opencode.py

  cloud-identity-probes:
    name: Cloud identity probe policy tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=pipeline python -m unittest pipeline/test_tencent_oidc.py pipeline/test_tencent_cos_probe.py pipeline/test_web_delivery.py
