name: Agent Builder (owner-approved issues only)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional open issue whose title starts with [agent-ready]
        required: false
        type: string
      dry_run:
        description: Validate the no-secret path; never call a model or create a PR
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '31 1 * * 2,5'

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: public-agent-builder
  cancel-in-progress: false

jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      issue_number: ${{ steps.pick.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select exactly one owner-approved issue
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo 'dry_run=true' >> "$GITHUB_OUTPUT"
            echo 'No model call or repository write will occur in dry-run mode.'
            exit 0
          fi
          number="$INPUT_ISSUE"
          active_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json headRefName --jq '.[].headRefName')"
          if [ -z "$number" ]; then
            candidates="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label agent-ready --limit 100 --json number,title --jq '.[] | select(.title | startswith("[agent-ready]")) | .number')"
            for candidate in $candidates; do
              if ! grep -q "^agent/issue-$candidate-run-" <<< "$active_prs"; then
                number="$candidate"
                break
              fi
            done
          fi
          if [ -z "$number" ]; then
            echo 'No [agent-ready] issue; no model call or repository write will occur.'
            python3 pipeline/agent_run_outcome.py "$RUNNER_TEMP/agent-builder-outcome.json" builder no_task || true
            exit 0
          fi
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue number."
            exit 1
          fi
          approved="$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json title,state,labels --jq 'select(.state == "OPEN" and (.title | startswith("[agent-ready]")) and (.labels | any(.name == "agent-ready"))) | .number')"
          if [ "$approved" != "$number" ]; then
            echo "::error::Issue #$number is not open and explicitly owner-labeled agent-ready."
            exit 1
          fi
          if grep -q "^agent/issue-$number-run-" <<< "$active_prs"; then
            echo "Issue #$number already has an open Agent PR; skipping duplicate."
            exit 0
          fi
          echo "issue_number=$number" >> "$GITHUB_OUTPUT"
      - name: Record selector outcome
        if: always()
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/agent-builder-outcome.json" ]; then
            {
              echo '### Machine-readable Builder outcome'
              echo '```json'
              cat "$RUNNER_TEMP/agent-builder-outcome.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  dry-run:
    needs: select
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify no-secret policy and outcome tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 pipeline/test_agent_run_outcome.py
          python3 .github/scripts/tests/test_opencode.py
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/agent-builder.yml').read_text()
          assert "No model call or repository write will occur in dry-run mode." in workflow
          assert "secrets.DEEPSEEK_API_KEY" in workflow
          print("Builder dry-run policy checks passed; no model request or write was performed.")
          PY
      - name: Show dry-run result
        if: always()
        run: echo 'No model request, secret use, or repository write occurred in dry-run mode.' >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: select
    if: ${{ github.ref == 'refs/heads/main' && needs.select.outputs.issue_number != '' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: write
    env:
      ISSUE_NUMBER: ${{ needs.select.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check official DeepSeek credential
        id: key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo '::warning::DEEPSEEK_API_KEY is not configured; no model call was made.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            python3 pipeline/agent_run_outcome.py "$RUNNER_TEMP/agent-builder-outcome.json" builder missing_credentials || true
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare approved public issue input
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-task
          echo '.agent-task/' >> .git/info/exclude
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,title,body,state,labels > .agent-task/issue.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('.agent-task/issue.json').read_text())
          import os
          if payload.get('state') != 'OPEN' or payload.get('number') != int(os.environ['ISSUE_NUMBER']):
              raise SystemExit('Issue state or identity changed.')
          if not payload.get('title', '').startswith('[agent-ready]'):
              raise SystemExit('Issue title is not approved.')
          if not any(label.get('name') == 'agent-ready' for label in payload.get('labels', [])):
              raise SystemExit('Issue lacks the owner-managed agent-ready label.')
          if len(Path('.agent-task/issue.json').read_bytes()) > 32768:
              raise SystemExit('Issue input exceeds the 32 KiB limit.')
          PY
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - uses: subosito/flutter-action@v2
        if: steps.key.outputs.ready == 'true'
        with:
          channel: stable
          cache: true
      - name: Install public test dependencies
        if: steps.key.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix miniprogram
          (cd flutter_app && flutter pub get)
      - name: Save trusted runner outside model workspace
        if: steps.key.outputs.ready == 'true'
        run: cp .github/scripts/run-opencode.py "$RUNNER_TEMP/run-opencode.py"
      - name: Install pinned OpenCode CLI
        if: steps.key.outputs.ready == 'true'
        run: npm install --global opencode-ai@1.19.0
      - name: Run DeepSeek Builder without GitHub credentials or shell access
        id: model
        if: steps.key.outputs.ready == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 "$RUNNER_TEMP/run-opencode.py" builder .agent-task/result.md
      - name: Bound and restrict proposed file changes
        if: steps.key.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', '--name-only', '-z', 'HEAD']).decode().split('\0')
          paths += subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z']).decode().split('\0')
          paths = sorted(set(p for p in paths if p))
          protected = (
              '.github/', '.opencode/', 'AGENTS.md', 'opencode.json', 'opencode.jsonc',
              'pipeline/', 'cloudfunctions/', 'miniprogram/cloudfunctions/',
              'miniprogram/project.config.json', 'miniprogram/project.private.config.json',
              'miniprogram/package.json', 'miniprogram/package-lock.json',
              'flutter_app/pubspec.yaml', 'flutter_app/pubspec.lock',
              'flutter_app/assets/',
          )
          allowed = ('flutter_app/lib/', 'flutter_app/test/', 'flutter_app/integration_test/', 'miniprogram/pages/', 'miniprogram/components/', 'miniprogram/core/', 'miniprogram/adapters/', 'miniprogram/services/', 'miniprogram/wxs/', 'miniprogram/e2e/', 'docs/')
          if any(p.startswith(protected) or p in protected for p in paths):
              raise SystemExit('Agent changed protected policy, dependency, cloud, or licensed-asset paths.')
          if any(not (p == 'README.md' or p in ('miniprogram/app.ts', 'miniprogram/app.wxss', 'miniprogram/theme.json') or p.startswith(allowed)) for p in paths):
              raise SystemExit('Agent changed a path outside the public application/docs allowlist.')
          if len(paths) > 30:
              raise SystemExit('Agent change exceeds the 30-file limit.')
          total = 0
          for name in paths:
              path = Path(name)
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('Agent added a symlink or deleted a file; no PR permitted.')
              total += path.stat().st_size
          if total > 512 * 1024:
              raise SystemExit('Agent change exceeds the 512 KiB limit.')
          PY
      - name: Run independent public tests
        if: steps.key.outputs.ready == 'true'
        id: gates
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export EP_NATIVE_TEST_WORKSPACE=1
          python3 pipeline/prepare_native_test_assets.py
          python3 pipeline/versioning.py check
          (cd miniprogram && npm run typecheck && npm test && npm run validate)
          (cd flutter_app && flutter test && flutter build web --release)
          PYTHONPATH=pipeline python3 -m unittest discover -s pipeline -p 'test_*.py' -v
          python3 .github/scripts/tests/test_opencode.py
      - name: Remove only generated synthetic test fixtures
        if: always() && steps.key.outputs.ready == 'true'
        shell: bash
        run: |
          rm -f flutter_app/assets/audio/0001/pb.wav flutter_app/assets/audio/0001/dg.wav
          rmdir --ignore-fail-on-non-empty flutter_app/assets/audio/0001 || true
          rm -f flutter_app/assets/lessons_safe/index.json flutter_app/assets/lessons_safe/lesson_0001.json
          rm -f flutter_app/build/native-fixture.json
      - name: Record Builder test failure
        if: steps.key.outputs.ready == 'true' && steps.gates.outcome == 'failure'
        run: python3 pipeline/agent_run_outcome.py "$RUNNER_TEMP/agent-builder-outcome.json" builder tests_failed || true
      - name: Create an unmerged draft pull request
        if: steps.key.outputs.ready == 'true' && steps.gates.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_RESULT: ${{ steps.gates.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            python3 pipeline/agent_run_outcome.py "$RUNNER_TEMP/agent-builder-outcome.json" builder no_changes || true
            echo '::error::Builder produced no proposed changes; no PR was created.'
            exit 1
          fi
          branch="agent/issue-$ISSUE_NUMBER-run-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "agent: propose work for issue #$ISSUE_NUMBER"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c http.extraheader="$header" push origin "HEAD:refs/heads/$branch"
          python3 pipeline/agent_run_outcome.py "$RUNNER_TEMP/agent-builder-outcome.json" builder draft_pr_delivered
          {
            echo "Automated, unmerged proposal for #$ISSUE_NUMBER."
            echo
            echo "Fixes #$ISSUE_NUMBER"
            echo
            echo "Independent public test gates passed before PR creation."
            echo "Review app behavior and remaining device-specific risks before merge."
            echo "No production deployment was performed."
          } > "$RUNNER_TEMP/agent-pr-body.md"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --draft \
            --title "agent: proposed work for #$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/agent-pr-body.md"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" || echo '::warning::Unable to dispatch public CI.'
          gh workflow run mobile-regression.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" || echo '::warning::Unable to dispatch native regression.'
      - name: Record failed inference without raw provider output
        if: always() && steps.model.outcome == 'failure'
        run: python3 pipeline/agent_run_outcome.py "$RUNNER_TEMP/agent-builder-outcome.json" builder inference_failed || true
      - name: Show non-secret outcome
        if: always()
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/agent-builder-outcome.json" ]; then
            {
              echo '### Machine-readable Builder outcome'
              echo '```json'
              cat "$RUNNER_TEMP/agent-builder-outcome.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
