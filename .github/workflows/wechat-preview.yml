name: WeChat Mini Program (staged verification/upload)

on:
  pull_request:
    paths:
      - 'miniprogram/**'
      - 'release/versions.json'
      - 'pipeline/versioning.py'
      - '.github/workflows/wechat-preview.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify: offline checks; upload: WeChat development code'
        type: choice
        required: true
        default: verify
        options: [verify, upload]
      confirm_wechat_code_upload:
        description: 'For upload, type UPLOAD_WECHAT_DEV_CODE (never publishes production)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: wechat-staged-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Credential-free Mini Program validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - name: Install locked dependencies
        working-directory: miniprogram
        run: npm ci
      - name: Typecheck, unit tests and configuration validation
        working-directory: miniprogram
        run: |
          npm run typecheck
          npm test
          npm run validate
      - name: Enforce source version alignment
        run: python3 pipeline/versioning.py check
      - name: Audit source packaging, guard tests and verify offline
        run: |
          node miniprogram/scripts/wechat-package-audit.mjs
          node --test miniprogram/scripts/wechat-ci.test.mjs
          node miniprogram/scripts/wechat-ci.mjs verify

  transmit:
    name: Manually authorized WeChat development-code upload
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'upload' &&
      inputs.confirm_wechat_code_upload == 'UPLOAD_WECHAT_DEV_CODE'
    runs-on: ubuntu-24.04
    environment: wechat-upload
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - name: Install locked dependencies
        working-directory: miniprogram
        run: npm ci
      - name: Confirm source content before WeChat request
        run: node miniprogram/scripts/wechat-package-audit.mjs
      - name: Upload development code (never release)
        env:
          WECHAT_CI_PRIVATE_KEY_B64: ${{ secrets.WECHAT_CI_PRIVATE_KEY_B64 }}
          WECHAT_CI_MODE: upload
          WECHAT_CI_APPROVED: ${{ inputs.confirm_wechat_code_upload }}
          WECHAT_CI_ROBOT: ${{ vars.WECHAT_CI_ROBOT || '9' }}
          WECHAT_CI_TIMEOUT_MS: ${{ vars.WECHAT_CI_TIMEOUT_MS || '900000' }}
          TMPDIR: ${{ runner.temp }}
        run: timeout --signal=TERM --kill-after=20s 1200s node miniprogram/scripts/wechat-ci.mjs upload
