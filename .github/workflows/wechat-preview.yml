name: WeChat Mini Program (staged verification/upload)

on:
  pull_request:
    paths:
      - 'miniprogram/**'
      - 'release/versions.json'
      - 'pipeline/versioning.py'
      - '.github/workflows/wechat-preview.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify: offline checks; preview: developer QR; upload: development code'
        type: choice
        required: true
        default: verify
        options: [verify, preview, upload]
      confirm_wechat_code_upload:
        description: 'For preview/upload, type UPLOAD_WECHAT_DEV_CODE (never publishes production)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: wechat-staged-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Credential-free Mini Program validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - name: Install locked dependencies
        working-directory: miniprogram
        run: npm ci
      - name: Typecheck, unit tests and configuration validation
        working-directory: miniprogram
        run: |
          npm run typecheck
          npm test
          npm run validate
      - name: Enforce source version alignment
        run: python3 pipeline/versioning.py check
      - name: Audit source packaging, guard tests and verify offline
        run: |
          node miniprogram/scripts/wechat-package-audit.mjs
          node --test miniprogram/scripts/wechat-ci.test.mjs
          node miniprogram/scripts/wechat-ci.mjs verify

  transmit:
    name: Manually authorized WeChat development upload / preview
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (inputs.mode == 'upload' || inputs.mode == 'preview') &&
      inputs.confirm_wechat_code_upload == 'UPLOAD_WECHAT_DEV_CODE'
    runs-on: ubuntu-24.04
    environment: wechat-upload
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - name: Install locked dependencies
        working-directory: miniprogram
        run: npm ci
      - name: Confirm source content before WeChat request
        run: node miniprogram/scripts/wechat-package-audit.mjs
      - name: Transmit to WeChat (preview QR or development upload)
        env:
          WECHAT_CI_PRIVATE_KEY_B64: ${{ secrets.WECHAT_CI_PRIVATE_KEY_B64 }}
          WECHAT_CI_PROXY: ${{ secrets.WECHAT_CI_PROXY }}
          WECHAT_CI_MODE: ${{ inputs.mode }}
          WECHAT_CI_APPROVED: ${{ inputs.confirm_wechat_code_upload }}
          WECHAT_CI_ROBOT: ${{ vars.WECHAT_CI_ROBOT || '9' }}
          WECHAT_CI_TIMEOUT_MS: ${{ vars.WECHAT_CI_TIMEOUT_MS || '900000' }}
          WECHAT_CI_OUTPUT_DIR: ${{ runner.temp }}/wechat-preview
          TMPDIR: ${{ runner.temp }}
        run: timeout --signal=TERM --kill-after=20s 1200s node miniprogram/scripts/wechat-ci.mjs "$WECHAT_CI_MODE"
      - name: Verify platform status via WeChat OpenAPI
        env:
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
          WECHAT_CI_PROXY: ${{ secrets.WECHAT_CI_PROXY }}
        run: node miniprogram/scripts/wechat-server-api.mjs
      - name: Store developer preview QR privately for one week
        if: inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: EnglishPod-WeChat-DEV-PREVIEW-${{ github.sha }}
          path: ${{ runner.temp }}/wechat-preview/preview.jpg
          if-no-files-found: error
          retention-days: 7
      - name: Surface preview summary
        if: inputs.mode == 'preview'
        run: |
          echo "### 🚀 WeChat Mini Program Developer Preview Generated" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Robot**: \`${{ vars.WECHAT_CI_ROBOT || '9' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Preview Artifact**: Download the \`EnglishPod-WeChat-DEV-PREVIEW-${{ github.sha }}\` artifact to scan and test directly on authorized devices." >> $GITHUB_STEP_SUMMARY
      - name: Trigger MiniTest cloud testing (optional)
        if: inputs.mode == 'upload'
        env:
          MINITEST_TOKEN: ${{ secrets.MINITEST_TOKEN }}
          MINITEST_PLAN_ID: ${{ vars.MINITEST_PLAN_ID }}
        run: node miniprogram/scripts/wechat-minitest.mjs
